{% extends 'base.html' %}

{% block title %}
Edit Movie
{% endblock %}

{% block content %}

<div class="form-card">

    <h1>Edit Movie</h1>

    <form method="POST" enctype="multipart/form-data">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Save Changes</button>

    </form>

    <a href="{% url 'movie_list' %}">
        Back to Movies
    </a>

</div>

{% endblock %}
