{% extends 'base.html' %}

{% block title %}
Edit Profile
{% endblock %}

{% block content %}

<div class="form-card">

    <h1>Edit Profile</h1>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Save Changes</button>

    </form>

    <a href="{% url 'profile' %}">
        Back to Profile
    </a>

</div>

{% endblock %}
