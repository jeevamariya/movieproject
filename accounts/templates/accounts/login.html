{% extends 'base.html' %}

{% block title %}
Login
{% endblock %}

{% block content %}

<div class="form-card">

    <h1>Login</h1>

    {% if error %}
        <p class="error-message">{{ error }}</p>
    {% endif %}

    <form method="POST">

        {% csrf_token %}

        <label>Username:</label>
        <input type="text" name="username" required>

        <label>Password:</label>
        <input type="password" name="password" required>

        <button type="submit">Login</button>

    </form>

</div>

{% endblock %}
